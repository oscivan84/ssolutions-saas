services:
  - type: web
    name: ssolutions-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_SERVICE_INTERNAL_KEY
        value: ss-demo-key-2026
      - key: DEFAULT_AI_PROVIDER
        value: anthropic
    plan: free
    healthCheckPath: /health
